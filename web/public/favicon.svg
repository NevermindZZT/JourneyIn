<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="jin_bg" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24695C" />
      <stop offset="1" stop-color="#16463D" />
    </linearGradient>
    <linearGradient id="jin_path" x1="36" y1="52" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7E8D2" />
      <stop offset="1" stop-color="#56C9A3" />
    </linearGradient>
    <linearGradient id="jin_pin" x1="68" y1="20" x2="104" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7F62" />
      <stop offset="1" stop-color="#E56A4D" />
    </linearGradient>
    <filter id="jin_pin_shadow" x="62" y="18" width="48" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-opacity="0.3" flood-color="#0A221E"/>
    </filter>
  </defs>

  <!-- 背景平滑圆角矩形 -->
  <rect width="128" height="128" rx="36" fill="url(#jin_bg)" />

  <!-- 路线轨迹 J (从右上方图钉下方发端，柔顺向下，在底部形成优美的弧线后上挑) -->
  <path d="M84 46 C84 74 76 90 55 90 C41 90 33 81 33 70 C33 60 40 54 48 54 C54 54 58 58 58 64" 
        stroke="url(#jin_path)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 途经点节点 Stop Marker -->
  <circle cx="48" cy="64" r="3.5" fill="#FFFFFF" />

  <!-- 右上方定位图钉 Pin -->
  <g filter="url(#jin_pin_shadow)">
    <path d="M86 21 C76.06 21 68 29.06 68 39 C68 51.5 86 67 86 67 C86 67 104 51.5 104 39 C104 29.06 95.94 21 86 21 Z" 
          fill="url(#jin_pin)" />
    <circle cx="86" cy="38" r="6" fill="#FFFFFF" />
  </g>
</svg>