name: JourneyIn Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and web bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 1.2.3" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck Web
        run: pnpm --dir web typecheck

      - name: Build Web bundle
        run: pnpm --dir web build

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: journeyin-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: Build ${{ matrix.target.goos }}-${{ matrix.target.goarch }} binary
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: journeyin-web-dist
          path: web/dist

      - name: Build packaged executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package
          BINARY=journeyin
          if [[ "${{ matrix.target.goos }}" == "windows" ]]; then
            BINARY=journeyin.exe
          fi
          GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "package/$BINARY" ./cmd/journeyin
          if [[ "${{ matrix.target.goos }}" == "windows" ]]; then
            (cd package && zip -q "../dist/journeyin_"$VERSION"_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.zip" "$BINARY")
          else
            tar -C package -czf "dist/journeyin_"$VERSION"_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.tar.gz" "$BINARY"
          fi

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: journeyin-binary-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Publish multi-architecture Docker image
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: nevermindzzt
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nevermindzzt/journeyin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=JourneyIn
            org.opencontainers.image.description=Map-first travel planning
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/NevermindZZT/JourneyIn

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: [verify, binaries, docker]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download executable packages
        uses: actions/download-artifact@v4
        with:
          pattern: journeyin-binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "JourneyIn v$VERSION" \
            --generate-notes
